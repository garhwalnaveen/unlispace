[package]
name = "uls-smb"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
build = "build.rs"

[features]
backend = ["dep:uls-vfs"]
demo = ["backend", "dep:uls-client", "dep:uls-mock", "dep:futures-util", "dep:tempfile"]

[[bin]]
name = "smb-vfs-demo"
path = "src/bin/smb-vfs-demo.rs"
required-features = ["demo"]

[[test]]
name = "vfs_backend"
path = "tests/vfs_backend.rs"
required-features = ["backend"]

[dependencies]
smb-server.workspace = true
tokio = { workspace = true, features = ["full"] }
bytes.workspace = true
async-trait.workspace = true
thiserror.workspace = true
getrandom.workspace = true
tracing-subscriber.workspace = true
uls-vfs = { workspace = true, optional = true }
uls-client = { workspace = true, optional = true }
uls-mock = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
uls-client.workspace = true
uls-mock.workspace = true
futures-util.workspace = true
socket2.workspace = true
hmac.workspace = true
sha2 = "=0.10.9"
md-5.workspace = true
md4.workspace = true
aes.workspace = true
cmac.workspace = true
rc4.workspace = true
aes-gcm.workspace = true
ccm.workspace = true
tempfile.workspace = true
smb-server = { workspace = true, features = ["localfs"] }

[build-dependencies]
cc.workspace = true

