[package]
name = "smb-server"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/paltaio/rust-smb-server"
description = "SMB2/3 file-sharing server library with pluggable storage backends."

[dependencies]
tokio = { workspace = true }
bytes.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
binrw = { workspace = true }
getrandom = "=0.4.2"
cap-std = { workspace = true, optional = true }
hmac.workspace = true
sha2.workspace = true
md-5.workspace = true
md4.workspace = true
aes.workspace = true
cmac.workspace = true
rc4.workspace = true
aes-gcm.workspace = true
ccm.workspace = true
socket2 = "=0.6.5"

[target.'cfg(windows)'.dependencies]
cap-primitives = { workspace = true, optional = true }
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Storage_FileSystem", "Win32_System_IO"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"], optional = true }
libc = "=0.2.186"

[features]
default = []
localfs = ["dep:cap-std", "dep:cap-primitives", "dep:rustix", "dep:windows-sys"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = "=0.3.20"
tempfile = "=3.23.0"
hex = "=0.4.3"

[[test]]
name = "integration_localfs"
path = "tests/integration_localfs.rs"
required-features = ["localfs"]

[[test]]
name = "integration_localfs_write"
path = "tests/integration_localfs_write.rs"
required-features = ["localfs"]

[[test]]
name = "integration_negotiate"
path = "tests/integration_negotiate.rs"
required-features = ["localfs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
