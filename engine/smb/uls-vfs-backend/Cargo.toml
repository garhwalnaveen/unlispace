[package]
name = "uls-vfs-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[features]
demo = ["dep:uls-client", "dep:uls-mock", "dep:futures-util", "dep:tempfile"]

[[bin]]
name = "smb-vfs-demo"
path = "src/bin/smb-vfs-demo.rs"
required-features = ["demo"]

[dependencies]
uls-smb.workspace = true
uls-vfs.workspace = true
uls-client = { workspace = true, optional = true }
uls-mock = { workspace = true, optional = true }
async-trait.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["full"] }
futures-util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
uls-client.workspace = true
uls-mock.workspace = true
futures-util.workspace = true
tempfile.workspace = true
smb-server.workspace = true

[lints.rust]
unsafe_code = "forbid"
