[package]
name = "uls-vfs-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[features]
demo = ["dep:uls-mock", "dep:futures-util", "dep:tempfile"]

[[bin]]
name = "smb-vfs-demo"
path = "src/bin/smb-vfs-demo.rs"
required-features = ["demo"]

[dependencies]
uls-smb = { path = "..", version = "=0.1.0" }
uls-vfs = { path = "../../uls-vfs", version = "=0.0.1" }
uls-client = { path = "../../uls-client", version = "=0.0.1" }
uls-mock = { path = "../../uls-mock", version = "=0.0.1", optional = true }
async-trait.workspace = true
bytes.workspace = true
tokio.workspace = true
futures-util = { version = "=0.3.34", optional = true }
tempfile = { version = "=3.27.0", optional = true }

[dev-dependencies]
uls-mock = { path = "../../uls-mock", version = "=0.0.1" }
futures-util = "=0.3.34"
tempfile = "=3.27.0"
smb-server.workspace = true

[lints.rust]
unsafe_code = "forbid"
