[workspace]
resolver = "3"
members = ["uls-chunk", "uls-proto", "uls-client", "ulsd", "uls-mock", "uls-vfs", "uls-auth"]
exclude = ["smb"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
uls-chunk = { path = "uls-chunk" }
uls-proto = { path = "uls-proto" }
uls-client = { path = "uls-client" }
uls-mock = { path = "uls-mock" }
uls-vfs = { path = "uls-vfs" }
uls-auth = { path = "uls-auth" }

fastcdc = "=3.2.1"
sha2 = "=0.11.1"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "json", "query"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal", "process", "net"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "=0.3.34"
bytes = "=1.12.1"
dirs = "=7.0.0"
mime_guess = "=2.0.5"
clap = { version = "=4.6.7", features = ["derive"] }
nfsserve = "=0.11.0"
async-trait = "=0.1.92"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tempfile = "=3.27.0"
wiremock = "=0.6.5"
axum = "=0.8.9"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
base64 = "=0.22.1"
security-framework = "=3.7.0"

[profile.release]
lto = "thin"
