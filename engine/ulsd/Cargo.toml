[package]
name = "ulsd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
smb = ["dep:uls-smb", "dep:uls-vfs-backend"]

[lints]
workspace = true

[dependencies]
uls-client.workspace = true
uls-proto.workspace = true
uls-auth.workspace = true
uls-vfs.workspace = true
uls-smb = { path = "../smb", version = "=0.1.0", optional = true }
uls-vfs-backend = { path = "../smb/uls-vfs-backend", version = "=0.1.0", optional = true }
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["io-std"] }
futures-util.workspace = true
nfsserve.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

[dev-dependencies]
uls-mock.workspace = true
tempfile.workspace = true
wiremock.workspace = true
base64.workspace = true
