name: Mac release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        default: 0.2.0
        type: string
  push:
    tags:
      - 'mac-v*'
  pull_request:
    paths:
      - '.github/workflows/mac-release.yml'
      - 'engine/**'
      - 'mac/**'

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ULS_API_URL: https://unlispace-api.naveen-f3d.workers.dev

jobs:
  build:
    name: Build and verify DMG
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#mac-v}"
          else
            version="${INPUT_VERSION:-0.2.0}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the engine
        working-directory: engine
        run: |
          cargo build --locked -p ulsd --features smb
          cargo build --locked --release -p ulsd --features smb

      - name: Configure optional Apple signing
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          have_certificate() {
            [[ -n "${APPLE_CERTIFICATE_BASE64:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]
          }
          have_apple_id_credentials() {
            [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]
          }
          have_api_key_credentials() {
            [[ -n "${APPLE_API_KEY_BASE64:-}" && -n "${APPLE_API_KEY_ID:-}" ]]
          }
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'Pull request validation uses an ad-hoc, unnotarized DMG.'
            echo 'mode=ad-hoc-unnotarized' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! have_certificate || { ! have_apple_id_credentials && ! have_api_key_credentials; }; then
            echo 'Apple signing secrets incomplete; building an ad-hoc, unnotarized DMG.'
            echo 'mode=ad-hoc-unnotarized' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/orbit-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/orbit-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$certificate"

          if have_apple_id_credentials; then
            xcrun notarytool store-credentials orbit-ci \
              --keychain "$keychain" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
          else
            api_key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key"
            notary_args=(--keychain "$keychain" --key "$api_key" --key-id "$APPLE_API_KEY_ID")
            if [[ -n "${APPLE_API_ISSUER:-}" ]]; then notary_args+=(--issuer "$APPLE_API_ISSUER"); fi
            xcrun notarytool store-credentials orbit-ci "${notary_args[@]}"
            rm -f "$api_key"
          fi

          echo "ULS_SIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo 'ULS_NOTARY_PROFILE=orbit-ci' >> "$GITHUB_ENV"
          echo 'mode=developer-id-notarized' >> "$GITHUB_OUTPUT"

      - name: Test, package and verify the release
        env:
          ULSD_BIN: ${{ github.workspace }}/engine/target/release/ulsd
          ULS_VERSION: ${{ steps.version.outputs.version }}
          ULS_BUILD: ${{ github.run_number }}
        run: bash mac/scripts/release.sh

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "mac/build/Orbit-$VERSION.dmg" "dist/"
          cp "mac/build/Orbit-$VERSION.dmg.sha256" "dist/"
          if [[ -f mac/build/feed/appcast.xml ]]; then cp mac/build/feed/appcast.xml dist/; fi
          shasum -a 256 "dist/Orbit-$VERSION.dmg"
          cat "dist/Orbit-$VERSION.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-macos-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mac-v'))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-macos-${{ needs.build.outputs.version }}
          path: dist

      - name: Write release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING: ${{ needs.build.outputs.signing }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Orbit for Mac $VERSION.

          ## Requirements

          - macOS 14 or later
          - Apple silicon Mac

          ## Verification

          Confirm the SHA-256 checksum in \`Orbit-$VERSION.dmg.sha256\` before installing.
          Build signing mode: \`$SIGNING\`.
          EOF
          cat notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNING: ${{ needs.build.outputs.signing }}
        run: |
          set -euo pipefail
          tag="mac-v$VERSION"
          assets=("dist/Orbit-$VERSION.dmg" "dist/Orbit-$VERSION.dmg.sha256")
          if [[ -f dist/appcast.xml ]]; then assets+=(dist/appcast.xml); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            args=(--target "$GITHUB_SHA" --title "Orbit for Mac $VERSION" --notes-file notes.md)
            if [[ "$SIGNING" == ad-hoc-unnotarized ]]; then args+=(--prerelease); fi
            gh release create "$tag" "${args[@]}" "${assets[@]}"
          fi
          gh release view "$tag" --json url --jq .url
